{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7 col-lg-6">
        <div class="card glass-panel shadow-lg border-0 rounded-4 text-center p-4 p-md-5">
            <div class="mb-4 text-warning">
                <i class="bi bi-clock-history" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-2 text-white">Election Not Active</h2>
            <h5 class="text-secondary mb-4">{{ election.name }}</h5>
            <p class="text-muted mb-4">
                This election has either concluded or has not yet been launched by the conductor (<strong class="text-white">{{ election.conductor }}</strong>).
            </p>
            
            <a href="{{ url_for('login') }}" class="btn btn-premium btn-lg rounded-pill px-5 fw-bold">
                Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
